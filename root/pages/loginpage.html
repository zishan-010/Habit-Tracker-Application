<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../resources/images/title_icon.png">
    <title> Log in — Habit Tracker </title>
    <link rel="stylesheet" href="../resources/css/loginpage.css">
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="main_container">
        <div class="container">
            <div class="icon-wrap">
                <!-- brand mark: person with raised arms, echoing hero icon -->
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="34" r="12" stroke="#161B2E" stroke-width="4" />
                    <path d="M50 46 L50 70 M50 52 L30 30 M50 52 L70 30" stroke="#3B5CF6" stroke-width="6"
                        stroke-linecap="round" />
                    <path d="M38 70 L50 70 L58 90 M50 70 L44 90" stroke="#3B5CF6" stroke-width="6"
                        stroke-linecap="round" />
                </svg>
            </div>
            <h1><span>Habit</span> Tracker</h1>
            <p class="subtitle">Log in to keep your streak going</p>
        </div>
        <div class="card">

            <form>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="row-between">
                    <label class="remember">
                        <input type="checkbox" id="remember" name="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">Log in</button>
            </form>

            <div class="divider">or continue with</div>
